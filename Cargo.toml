[package]
name = "greentic-gui"
version = "1.1.0-dev.0"
edition = "2024"
description = "Greentic GUI runtime (Axum-based) that serves tenant packs, enforces auth, and exposes worker/session APIs plus a browser SDK."
license = "MIT"
homepage = "https://greentic.ai"
repository = "https://github.com/greenticai/greentic-gui"
documentation = "https://github.com/greenticai/greentic-gui"
readme = "README.md"
keywords = [
    "greentic",
    "gui",
    "axum",
    "runtime",
    "wasm",
]
exclude = [
    "/node_modules/**",
    "/package-lock.json",
    "/package.json",
    "/playwright.config.ts",
    "/scripts/**",
    "/tests/**",
    "/ci/**",
    "/.github/**",
    "/.codex/**",
    "/Cargo.toml.orig",
    "/.DS_Store",
    "/**/.DS_Store",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[workspace]
members = [
    ".",
]
resolver = "2"

[workspace.metadata.dist]
ci = []
installers = []
cargo-dist-version = "0.28.0"
archive-formats = [
    "tar.gz",
    "zip",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[features]
default = []
remote-worker-gateway = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
http = "1"
greentic-telemetry = ">=1.1.0-dev, <1.2.0-0"
greentic-types = ">=1.1.0-dev, <1.2.0-0"
greentic-oauth-sdk = ">=1.1.0-dev, <1.2.0-0"
greentic-oauth-client = ">=1.1.0-dev, <1.2.0-0"
tokio-stream = "0.1"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
ciborium = "0.2"
semver = "1"
serde_json = "1"
tower = "0.5"
tracing = "0.1"
serde_with = "3"
thiserror = "2"
tempfile = "3"
kuchiki = "0"
regex = "1"
url = "2"
greentic-config = ">=1.1.0-dev, <1.2.0-0"
greentic-config-types = ">=1.1.0-dev, <1.2.0-0"
zip = "8"
toml = "1"

[dependencies.axum]
version = "0.8"
features = [
    "macros",
    "json",
]

[dependencies.hyper]
version = "1.8"
features = [
    "full",
]

[dependencies.greentic-session]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = true
features = [
    "interfaces",
    "redis",
]

[dependencies.greentic-distributor-client]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "http-runtime",
]

[dependencies.greentic-interfaces-guest]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false
features = [
    "gui-fragment",
]

[dependencies.greentic-interfaces-wasmtime]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false

[dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "rustls",
    "stream",
]

[dependencies.wasmtime]
version = "43"
features = [
    "component-model",
    "async",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
    "sync",
]

[dependencies.tower-http]
version = "0.6"
features = [
    "trace",
    "compression-br",
    "compression-deflate",
    "compression-gzip",
    "cors",
    "set-header",
]

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "env-filter",
    "fmt",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
]

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
]

[dependencies.greentic-interfaces-host]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false
features = [
    "worker-v1",
    "gui-fragment",
]

[dependencies.clap]
version = "4"
features = [
    "derive",
]

[dev-dependencies]
serde_json = "1"

[dev-dependencies.axum]
version = "0.8"
features = [
    "macros",
    "json",
]

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
]
